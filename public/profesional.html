<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portal profesional | Salta Soluciones</title><link rel="icon" href="/assets/favicon.png"><link rel="stylesheet" href="/css/styles.css"><style>
body{background:#f4f7fb}.portal{max-width:960px;margin:36px auto;padding:0 16px}.portal-head,.job{background:#fff;border:1px solid #dfe8f2;border-radius:16px;padding:18px;margin-bottom:14px}.job-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.job-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{font-size:13px;color:#667b90}.private-note{background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:10px;color:#9a3412}.portal button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.accept{background:#dcfce7;color:#166534}.reject{background:#fee2e2;color:#991b1b}.complete{background:#dbeafe;color:#1d4ed8}@media(max-width:650px){.job-grid{grid-template-columns:1fr}}
</style></head><body><main class="portal"><div class="portal-head"><img src="/assets/logo.png" alt="Salta Soluciones" style="height:52px"><h1>Portal privado del profesional</h1><p class="private-note">Este enlace es personal. No lo publiques ni lo compartas.</p><div id="portalStatus">Cargando…</div></div><div id="jobs"></div></main><script>
const esc=(v='')=>String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.search).get('token')||''; let data=null;
async function call(action='list',id=''){const r=await fetch('/api/professional-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action,id})});const o=await r.json().catch(()=>({}));if(!r.ok)throw new Error(o.error||'Error');return o;}
function yn(v){return v===true?'✅ Sí':v===false?'❌ No':'⏳ Pendiente'}
function render(){document.querySelector('#portalStatus').innerHTML=`Profesional: <strong>${esc(data.professional.name)}</strong>`;const rows=data.requests||[];document.querySelector('#jobs').innerHTML=rows.length?rows.map(r=>`<article class="job"><div class="job-grid"><div><strong>${esc(r.code)}</strong><div class="mini">${new Date(r.createdAt).toLocaleString('es-AR')}</div></div><div><strong>${esc(r.serviceName)}</strong><div class="mini">Estado: ${esc(r.status)}</div></div><div>Cliente: ${esc(r.firstName)} ${esc(r.lastName)}<br><a href="https://wa.me/${String(r.whatsapp||'').replace(/[^0-9]/g,'')}" target="_blank" rel="noreferrer">💬 WhatsApp cliente</a></div><div>${r.address?`Dirección: ${esc(r.address)}<br>`:''}${r.lat!=null&&r.lng!=null?`<a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" rel="noreferrer">📍 Ver GPS</a>`:''}</div></div>${r.description?`<p>${esc(r.description)}</p>`:''}<div class="mini">Tu respuesta: <strong>${esc(r.professionalResponse)}</strong> · Cliente confirmó visita: ${yn(r.clientVisit)} · Trabajo: ${yn(r.clientWork)}</div><div class="job-actions"><button class="accept" onclick="act('accept','${esc(r.id)}')">✅ Tomé el trabajo</button><button class="reject" onclick="act('reject','${esc(r.id)}')">❌ No se concretó</button><button class="complete" onclick="act('complete','${esc(r.id)}')">🛠 Trabajo finalizado</button></div></article>`).join(''):'<div class="job">Todavía no hay contactos registrados.</div>'}
async function act(a,id){try{data=await call(a,id);render()}catch(e){alert(e.message)}}
(async()=>{try{if(!token)throw new Error('Falta el token del enlace privado.');data=await call();render()}catch(e){document.querySelector('#portalStatus').textContent='Error: '+e.message;document.querySelector('#jobs').innerHTML=''}})();
</script></body></html>
