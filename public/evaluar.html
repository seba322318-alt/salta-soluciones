<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#062957">
  <title>Evaluar servicio | Salta Soluciones</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body{background:#f4f7fb}.evaluation-shell{max-width:760px;margin:34px auto;padding:0 16px 60px}.evaluation-card{background:#fff;border:1px solid #dfe8f2;border-radius:18px;padding:22px;box-shadow:0 12px 34px rgba(7,38,72,.08)}.evaluation-logo{height:58px;max-width:210px;object-fit:contain}.private-note{background:#eef7ff;border:1px solid #c9e5ff;color:#174a72;border-radius:12px;padding:11px;margin:15px 0}.eval-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.eval-meta>div{background:#f7fafc;border-radius:12px;padding:11px}.eval-actions{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 18px}.eval-actions button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.yes{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}.stars-picker{display:flex;gap:5px;margin:7px 0 12px}.stars-picker button{border:0;background:transparent;font-size:38px;color:#cbd5e1;cursor:pointer;padding:0 2px}.stars-picker button.active{color:#f59e0b}.eval-comment{width:100%;min-height:100px;border:1px solid #cfdbe7;border-radius:12px;padding:12px;font:inherit}.send-eval{margin-top:10px}.eval-status{margin-top:12px}.success-box{background:#ecfdf5;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:14px}.error-box{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:12px;padding:14px}@media(max-width:600px){.eval-meta{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="evaluation-shell">
    <div class="evaluation-card">
      <img class="evaluation-logo" src="/assets/logo.png" alt="Salta Soluciones">
      <div class="eyebrow welcome-eyebrow" style="margin-top:15px">Evaluación verificada</div>
      <h1 style="color:#062957;margin-bottom:8px">Contanos cómo fue el servicio</h1>
      <p class="section-sub">Este enlace corresponde a un contacto real generado desde Salta Soluciones. No necesitás usuario ni contraseña.</p>
      <div id="status" class="private-note">Cargando solicitud…</div>
      <div id="content"></div>
    </div>
  </main>
<script>
const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.search).get('token')||'';
let data=null, stars=0;
async function call(action='lookup',extra={}){const r=await fetch('/api/client-evaluation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action,...extra})});const o=await r.json().catch(()=>({}));if(!r.ok)throw new Error(o.error||'No se pudo procesar la solicitud');return o;}
function yesNo(v){return v===true?'✅ Sí':v===false?'❌ No':'⏳ Pendiente';}
function render(){
  const r=data.request; document.querySelector('#status').innerHTML=`Solicitud <strong>${esc(r.code)}</strong> · Estado: <strong>${esc(r.status)}</strong>`;
  let action='';
  if(r.clientVisit==null) action=`<h2>1. ¿El profesional asistió o te atendió?</h2><div class="eval-actions"><button class="yes" data-visit="true">✅ Sí, asistió</button><button class="no" data-visit="false">❌ No asistió</button></div>`;
  else if(r.clientVisit===true && r.clientWork==null) action=`<h2>2. ¿El trabajo fue realizado?</h2><div class="eval-actions"><button class="yes" data-work="true">✅ Sí, se realizó</button><button class="no" data-work="false">❌ No se realizó</button></div>`;
  else if(r.clientWork===true && !r.clientRatingSubmitted) action=`<h2>3. Calificá al profesional</h2><p class="section-sub">Elegí de 1 a 5 estrellas. Con 1, 2 o 3 estrellas te pediremos un comentario.</p><div id="stars" class="stars-picker"></div><textarea id="comment" class="eval-comment" placeholder="Contanos cómo fue tu experiencia"></textarea><button id="sendRating" class="primary-btn send-eval" type="button">Enviar evaluación</button><div id="ratingStatus" class="status-msg eval-status"></div>`;
  else if(r.clientRatingSubmitted) action=`<div class="success-box">✅ Gracias. Tu evaluación de <strong>${r.clientStars}/5 estrellas</strong> fue registrada y quedará pendiente de revisión antes de publicarse.</div>`;
  else if(r.clientVisit===false) action=`<div class="error-box">Registramos que el profesional no asistió. Salta Soluciones podrá ver esta información desde el panel de administración.</div>`;
  else if(r.clientWork===false) action=`<div class="error-box">Registramos que el trabajo no se realizó.</div>`;
  document.querySelector('#content').innerHTML=`<div class="eval-meta"><div><small>Profesional</small><br><strong>${esc(r.professionalName)}</strong></div><div><small>Servicio</small><br><strong>${esc(r.serviceName)}</strong></div><div><small>Profesional indicó</small><br><strong>${esc(r.professionalResponse||'Pendiente')}</strong></div><div><small>Trabajo finalizado por profesional</small><br><strong>${yesNo(r.professionalWork)}</strong></div></div>${action}`;
  document.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>act('confirmVisit',{value:b.dataset.visit==='true'}));
  document.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>act('confirmWork',{value:b.dataset.work==='true'}));
  if(document.querySelector('#stars')){stars=0;for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.textContent='★';b.setAttribute('aria-label',i+' estrellas');b.onclick=()=>{stars=i;[...document.querySelector('#stars').children].forEach((x,j)=>x.classList.toggle('active',j<i));};document.querySelector('#stars').appendChild(b);}document.querySelector('#sendRating').onclick=async()=>{const comment=document.querySelector('#comment').value.trim();const msg=document.querySelector('#ratingStatus');if(!stars){msg.textContent='Elegí de 1 a 5 estrellas.';return;}if(stars<=3&&!comment){msg.textContent='Con 1, 2 o 3 estrellas, contanos brevemente qué ocurrió.';return;}try{data=await call('rate',{stars,comment});render();}catch(e){msg.textContent='Error: '+e.message;}};}
}
async function act(action,extra){try{data=await call(action,extra);render();}catch(e){document.querySelector('#status').className='error-box';document.querySelector('#status').textContent='Error: '+e.message;}}
(async()=>{try{if(!token)throw new Error('Falta el código privado de evaluación.');data=await call();render();}catch(e){document.querySelector('#status').className='error-box';document.querySelector('#status').textContent='Error: '+e.message;document.querySelector('#content').innerHTML='';}})();
</script>
</body>
</html>
