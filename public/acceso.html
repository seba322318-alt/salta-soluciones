<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acceso administrador | Salta Soluciones</title><link rel="icon" href="/assets/favicon.png"><link rel="stylesheet" href="/css/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#031c3d,#075195)}.login{width:min(420px,calc(100% - 28px));background:#fff;border-radius:18px;padding:26px;border:1px solid #b7d8f5;box-shadow:0 25px 80px rgba(0,0,0,.28)}.login img{display:block;width:210px;height:140px;object-fit:contain;margin:auto}.login h1{text-align:center;margin:4px 0;color:#062957}.login p{text-align:center;color:#6b8098;font-size:13px}.login label{display:block;font-size:12px;font-weight:800;color:#062957;margin-top:16px}.login input{width:100%;margin-top:6px;border:1px solid #d4e1ee;border-radius:9px;padding:12px;font-size:16px}.login button{width:100%;margin-top:14px}.msg{font-size:12px;color:#b42318;text-align:center;margin-top:10px}</style></head><body><main class="login"><img src="/assets/logo.png" alt="Salta Soluciones"><h1>Acceso administrador</h1><p>Área privada de Salta Soluciones.</p><form id="loginForm"><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button class="primary-btn" type="submit">Ingresar</button><div id="msg" class="msg" aria-live="polite"></div></form></main><script>document.getElementById('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;document.getElementById('msg').textContent='Verificando…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const o=await r.json();if(!r.ok)throw new Error(o.error||'No autorizado');location.href='/admin/';}catch(err){document.getElementById('msg').textContent=err.message;}finally{b.disabled=false;}});</script></body></html>
